root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/api ./cmd/api"
bin = "./tmp/api"
delay = 1000
exclude_dir = ["tmp", "vendor", ".git"]
include_ext = ["go", "tpl", "tmpl", "html"]
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"

[color]
main = "yellow"
watcher = "cyan"
build = "green"
runner = "magenta"
